<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | ChitraBazzi</title>

    <link rel="stylesheet" href="css/auth.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

</head>

<body>

<div class="auth-container">

<div class="auth-card">

<div class="auth-header">

<a href="index.html" class="logo">
ChitraBazzi
</a>

<h2>Create Account</h2>

<p>
Join ChitraBazzi and start shopping today.
</p>

</div>

<form id="registerForm">

<div class="input-box">

<label>Full Name</label>

<input
type="text"
id="registerName"
placeholder="Enter your full name">

<small class="error" id="registerNameError"></small>

</div>


<div class="input-box">

<label>Email Address</label>

<input
type="email"
id="registerEmail"
placeholder="Enter your email">

<small class="error" id="registerEmailError"></small>

</div>


<div class="input-box">

<label>Password</label>

<div class="password-box">

<input
type="password"
id="registerPassword"
placeholder="Create password">

<i
class="fa-solid fa-eye togglePassword"
data-target="registerPassword">
</i>

</div>

<small class="error" id="registerPasswordError"></small>

</div>


<div class="input-box">

<label>Confirm Password</label>

<div class="password-box">

<input
type="password"
id="confirmPassword"
placeholder="Confirm password">

<i
class="fa-solid fa-eye togglePassword"
data-target="confirmPassword">
</i>

</div>

<small class="error" id="confirmPasswordError"></small>

</div>


<div class="terms">

<label>

<input type="checkbox" id="terms">

I agree to the

<a href="#">Terms & Conditions</a>

</label>

<small class="error" id="termsError"></small>

</div>


<button
type="submit"
class="auth-btn">

Create Account

</button>

</form>


<div class="auth-footer">

<p>

Already have an account?

<a href="login.html">

Login

</a>

</p>

</div>

</div>

</div>

<script src="js/auth.js"></script>

</body>

</html>
